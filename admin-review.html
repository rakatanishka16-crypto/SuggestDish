<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SuggestDish — Private business review</title><style>body{font:16px system-ui;background:#fff8f0;color:#29221c;max-width:850px;margin:40px auto;padding:20px}input,textarea,select,button{font:inherit;padding:12px;margin:8px 0;box-sizing:border-box;width:100%}button{background:#f36a21;color:white;border:0;border-radius:10px;cursor:pointer}article{background:white;padding:20px;margin:20px 0;border-radius:16px}label{display:block}input[type=checkbox]{width:auto}a{color:#a84511}#status{white-space:pre-wrap}</style><a href="/">SuggestDish</a><h1>Private business review</h1><p>Independently verify the business profile, authorised owner, menu price and diet before approval. A profile link alone does not verify ownership. Contact details remain in Neon for your private checks.</p><label>Private reviewer key<input id="key" type="password" autocomplete="off"></label><button id="load">Load pending submissions</button><p id="status" role="status" aria-live="polite"></p><div id="queue"></div><script>
const key=document.getElementById('key'),status=document.getElementById('status'),queue=document.getElementById('queue');
async function api(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+key.value},body:JSON.stringify(body),signal:AbortSignal.timeout(25000)});const d=await r.json();if(!r.ok)throw new Error(d.error || 'Request failed');return d;}
function text(tag,value,parent){const el=document.createElement(tag);el.textContent=value;parent.append(el);return el;}
document.getElementById('load').onclick=async()=>{queue.replaceChildren();status.textContent='Loading…';try{const d=await api('/api/business-review/queue',{});status.textContent=d.submissions.length+' pending submissions (up to 100 shown).';for(const s of d.submissions){const card=text('article','',queue);text('h2',s.businessName+' — '+s.city,card);text('p',s.address,card);text('p',s.dishName+' · ₹'+s.dishPrice+' · '+(s.isVeg?'Vegetarian':'Non-vegetarian'),card);for(const [label,url] of [['Business profile',s.profileUrl],['Menu source',s.menuUrl]]){if(!url)continue;try{if(new URL(url).protocol!=='https:')continue;const a=text('a',label,card);a.href=url;a.target='_blank';a.rel='noopener noreferrer';card.append(document.createElement('br'));}catch{}}
const decision=document.createElement('select');for(const [value,label] of [['needs_information','Request more information'],['rejected','Reject'],['approved','Approve verified business and dish']]){const o=text('option',label,decision);o.value=value;}card.append(decision);
const evidence=text('input','',text('label','Verified Google or Zomato evidence URL',card));evidence.type='url';
const notes=text('textarea','',text('label','Private review notes (minimum 20 characters)',card));notes.maxLength=2000;
const checked=text('input','',text('label',' I independently checked the business profile, owner authority, menu price and diet.',card));checked.type='checkbox';
const save=text('button','Save review decision',card);save.onclick=async()=>{save.disabled=true;try{const d=await api('/api/business-review/decision',{submissionId:s.id,status:decision.value,evidenceUrl:evidence.value,notes:notes.value,checked:checked.checked});status.textContent=d.message;card.remove();}catch(e){status.textContent=e.message;}finally{save.disabled=false;}};
}}catch(e){status.textContent=e.message;}};
</script></html>
